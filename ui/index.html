<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewASN — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; }
  /* gaya shadcn "card" */
  .card { background:#0f172a; border:1px solid #1e293b; border-radius:0.75rem; box-shadow:0 1px 2px rgb(0 0 0/.4); }
  .btn { display:inline-flex; align-items:center; gap:.4rem; border-radius:.5rem; font-size:.875rem; font-weight:500; padding:.5rem 1rem; transition:all .15s; cursor:pointer; }
  .btn-primary { background:#22c55e; color:#052e16; } .btn-primary:hover{background:#16a34a;}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-outline { border:1px solid #334155; color:#e2e8f0; } .btn-outline:hover{background:#1e293b;}
  .btn-ghost { color:#94a3b8; } .btn-ghost:hover{color:#f87171;}
  .input { background:#020618; border:1px solid #334155; border-radius:.5rem; padding:.5rem .75rem; font-size:.875rem; color:#e2e8f0; width:100%; }
  .input:focus{outline:2px solid #22c55e66; border-color:#22c55e;}
  .badge { display:inline-flex; align-items:center; border-radius:9999px; padding:.1rem .6rem; font-size:.75rem; font-weight:600; }
  .badge-green { background:#052e16; color:#4ade80; border:1px solid #14532d; }
  .badge-gray  { background:#1e293b; color:#94a3b8; border:1px solid #334155; }
  #log { scrollbar-width:thin; scrollbar-color:#334155 transparent; }
</style>
</head>
<body class="bg-[#020618] text-slate-200 min-h-screen">
<div class="max-w-5xl mx-auto p-6 space-y-6">

  <!-- Header -->
  <header class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-emerald-400">ReviewASN</h1>
      <p class="text-sm text-slate-400">Otomasi review perilaku — Kinerja Jabar</p>
    </div>
    <span id="statusBadge" class="badge badge-gray">Idle</span>
  </header>

  <div class="grid md:grid-cols-2 gap-6">

    <!-- Kartu MFA -->
    <section class="card p-5">
      <h2 class="font-semibold mb-3 flex items-center gap-2">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 11c0-1.1.9-2 2-2s2 .9 2 2v2m-8 0V11c0-1.1.9-2 2-2m-2 2v6h8v-6M6 8V6a6 6 0 0 1 12 0v2"/></svg>
        Kode MFA
      </h2>
      <div id="mfaList" class="space-y-3">
        <p class="text-sm text-slate-500">Belum ada akun dengan secret MFA.</p>
      </div>
    </section>

    <!-- Kartu Upload QR -->
    <section class="card p-5">
      <h2 class="font-semibold mb-3">Tambah Secret via QR</h2>
      <div id="dropZone" class="border-2 border-dashed border-slate-700 rounded-xl p-6 text-center cursor-pointer hover:border-emerald-500/60 transition">
        <p class="text-sm text-slate-400">Tarik gambar QR ke sini, atau klik untuk pilih file</p>
        <p class="text-xs text-slate-500 mt-1">otpauth:// / ekspor Google Authenticator</p>
      </div>
      <input type="file" id="qrFile" accept="image/*" class="hidden">
      <div id="qrHasil" class="mt-3 text-sm"></div>
      <div id="qrNip" class="mt-3 hidden">
        <label class="text-xs text-slate-400">NIP tujuan</label>
        <div class="flex gap-2 mt-1">
          <input id="nipInput" class="input" placeholder="NIP">
          <button id="btnSimpanQR" class="btn btn-primary">Simpan</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Kartu Akun -->
  <section class="card p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-semibold">Akun</h2>
      <div class="flex gap-2">
        <button id="btnSemua" class="btn btn-outline text-xs">Pilih Semua</button>
        <button id="btnJalankan" class="btn btn-primary">▶ Jalankan Review</button>
      </div>
    </div>
    <div id="akunList" class="space-y-2"></div>

    <!-- Form tambah -->
    <details class="mt-4 group">
      <summary class="text-sm text-emerald-400 cursor-pointer select-none">+ Tambah / Ubah Akun</summary>
      <div class="grid md:grid-cols-4 gap-2 mt-3">
        <input id="fNip" class="input" placeholder="NIP">
        <input id="fPass" class="input" type="password" placeholder="Password (kosongkan = tetap)">
        <input id="fSecret" class="input" placeholder="Secret MFA (opsional)">
        <button id="btnTambah" class="btn btn-primary">Simpan Akun</button>
      </div>
    </details>
  </section>

  <!-- Log -->
  <section class="card p-5">
    <div class="flex items-center justify-between mb-2">
      <h2 class="font-semibold">Log</h2>
      <button id="btnBersih" class="btn btn-ghost text-xs">Bersihkan</button>
    </div>
    <pre id="log" class="text-xs leading-5 h-64 overflow-y-auto bg-[#020618] rounded-lg p-3 border border-slate-800 whitespace-pre-wrap"></pre>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let secretTunda = null;

// ---------- akun ----------
async function muatAkun() {
  const r = await fetch('/api/akun'); const d = await r.json();
  $('#akunList').innerHTML = d.akun.length ? '' : '<p class="text-sm text-slate-500">Belum ada akun.</p>';
  d.akun.forEach(a => {
    const el = document.createElement('div');
    el.className = 'flex items-center gap-3 bg-[#020618] border border-slate-800 rounded-lg px-3 py-2';
    el.innerHTML = `
      <input type="checkbox" class="akunCek accent-emerald-500" value="${a.nip}">
      <span class="text-sm flex-1">${a.nip}</span>
      <span class="badge ${a.adaSecret?'badge-green':'badge-gray'}">${a.adaSecret?'MFA ✓':'tanpa MFA'}</span>
      <button class="btn btn-ghost text-xs" onclick="hapusAkun('${a.nip}')">Hapus</button>`;
    $('#akunList').appendChild(el);
  });
}
async function hapusAkun(nip) { await fetch('/api/akun?nip='+nip, {method:'DELETE'}); muatAkun(); muatMFA(); }

$('#btnTambah').onclick = async () => {
  const body = { nip: $('#fNip').value, password: $('#fPass').value, secret: $('#fSecret').value };
  const r = await fetch('/api/akun', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (r.ok) { ['fNip','fPass','fSecret'].forEach(i=>$('#'+i).value=''); muatAkun(); muatMFA(); }
  else alert(await r.text());
};

// ---------- jalankan ----------
$('#btnJalankan').onclick = async () => {
  const nips = [...document.querySelectorAll('.akunCek:checked')].map(c=>c.value);
  if (!nips.length) return alert('Pilih akun dulu.');
  $('#btnJalankan').disabled = true;
  const r = await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nips})});
  if (!r.ok) { alert(await r.text()); $('#btnJalankan').disabled = false; }
};
$('#btnSemua').onclick = () => document.querySelectorAll('.akunCek').forEach(c=>c.checked=true);

// ---------- status ----------
async function cekStatus() {
  const d = await (await fetch('/api/status')).json();
  const b = $('#statusBadge');
  if (d.jalan) { b.className='badge badge-green'; b.textContent='● ' + d.info; $('#btnJalankan').disabled=true; }
  else { b.className='badge badge-gray'; b.textContent='Idle'; if(!$('#btnJalankan').disabled && d.info) $('#btnJalankan').disabled=false; }
}

// ---------- MFA live ----------
async function muatMFA() {
  const d = await (await fetch('/api/mfa')).json();
  if (!d.mfa.length) return;
  $('#mfaList').innerHTML = d.mfa.map(m => `
    <div class="flex items-center justify-between bg-[#020618] border border-slate-800 rounded-lg px-4 py-3">
      <div>
        <p class="text-xs text-slate-400">${m.nip}</p>
        <p class="text-3xl font-bold tracking-[.3em] text-emerald-400 tabular-nums">${m.kode}</p>
      </div>
      <div class="w-10 h-10 rounded-full border-2 ${m.sisa<=5?'border-red-500':'border-emerald-600'} grid place-items-center text-xs font-bold">${m.sisa}</div>
    </div>`).join('');
}
setInterval(muatMFA, 1000); muatMFA();

// ---------- log SSE ----------
const es = new EventSource('/api/log');
es.onmessage = e => { $('#log').textContent += e.data.replace(/\u2028/g,'\n') + '\n'; $('#log').scrollTop = $('#log').scrollHeight; cekStatus(); };
$('#btnBersih').onclick = () => $('#log').textContent = '';

// ---------- QR ----------
$('#dropZone').onclick = () => $('#qrFile').click();
$('#qrFile').onchange = e => e.target.files[0] && kirimQR(e.target.files[0]);
$('#dropZone').ondragover = e => { e.preventDefault(); $('#dropZone').classList.add('border-emerald-500'); };
$('#dropZone').ondragleave = () => $('#dropZone').classList.remove('border-emerald-500');
$('#dropZone').ondrop = e => { e.preventDefault(); $('#dropZone').classList.remove('border-emerald-500'); e.dataTransfer.files[0] && kirimQR(e.dataTransfer.files[0]); };

async function kirimQR(file) {
  const fd = new FormData(); fd.append('file', file);
  $('#qrHasil').innerHTML = '<span class="text-slate-400">Memindai…</span>';
  const d = await (await fetch('/api/qr', {method:'POST', body: fd})).json();
  if (!d.ok) { $('#qrHasil').innerHTML = `<span class="text-red-400">${d.pesan||'gagal'}</span>`; return; }
  secretTunda = d.secret;
  $('#qrHasil').innerHTML = `<p class="text-emerald-400">✓ Secret terbaca: <code class="text-xs">${d.secret}</code></p>
    <p class="text-slate-400 text-xs mt-1">Kode sekarang: <b>${d.kode}</b></p>`;
  if (d.nip) { $('#qrHasil').innerHTML += `<p class="text-xs text-slate-500 mt-1">Tersimpan untuk ${d.nip}</p>`; muatAkun(); muatMFA(); }
  else { $('#qrNip').classList.remove('hidden'); }
}
$('#btnSimpanQR').onclick = async () => {
  const nip = $('#nipInput').value.trim(); if (!nip) return;
  const r = await fetch('/api/akun', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({nip, secret: secretTunda})});
  if (r.ok) { $('#qrNip').classList.add('hidden'); $('#qrHasil').innerHTML='<span class="text-emerald-400">✓ Tersimpan.</span>'; muatAkun(); muatMFA(); }
};

muatAkun(); cekStatus(); setInterval(cekStatus, 3000);
</script>
</body>
</html>
